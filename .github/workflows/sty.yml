name: Starlark types

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sty:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: tamird/sty@bdb6300cd497c88b446b4bd0bf3579ed1fbef38b
        with:
          audit-loads: true
          bazel-version: '9.3.0'
          files: |
            runfiles_group/identity_packager.bzl
            runfiles_group/providers.bzl
            runfiles_group/runfiles_group_analysis_test.bzl
            runfiles_group/private/lib/constants.bzl
      - name: Check example workspace
        uses: tamird/sty@bdb6300cd497c88b446b4bd0bf3579ed1fbef38b
        with:
          artifact-name: sty-example
          audit-loads: true
          bazel-version: '9.3.0'
          working-directory: example
